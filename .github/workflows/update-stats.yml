name: Update stats

on:
  schedule:
    - cron: "7 * * * *" # hourly, off the top of the hour when Actions is busiest
  workflow_dispatch:
  push:
    branches: [main]
    paths: [template.html, build.py, config.json, queries/**]

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stats and build page
        env:
          # Classic PAT with `repo` and `read:org`. The default GITHUB_TOKEN
          # can't see private contributions or other orgs' private repos.
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python build.py

      - name: Commit if the page changed
        run: |
          git add site/index.html
          if git diff --cached --quiet; then
            echo "No changes, skipping commit (and the Pages build)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update stats"
          git push
